experiment:
  seed: 28
  num_epochs_ssl: 150
  num_epochs_fine_tuning: 100
  batch_size_fine_tuning: 64

modalities:
  skeleton:
    model:
      poseformer:
        class_name: PoseFormer
        from_module: PoseFormerV4
        encoder_class_name: PoseFormer
        encoder_name: poseformer
        args: []
        kwargs:
          sample_length: 50
          opt:
            layers: 12
            number_of_kept_frames: 50
            number_of_kept_coeffs: 20
            naive: false
          embed_dim_ratio: 16
          num_heads: 8
          mlp_ratio: 2.0
          qkv_bias: true
          drop_rate: 0.09
          attn_drop_rate: 0.0263
          drop_path_rate: 0.000685
          batch_size: 64
      ssl:
        class_name: SimCLRUnimodal
        from_module: simclr_um
        kwargs:
          hidden: [256, 128]
          batch_size: 64
          temperature: 0.1
          n_views: 2
          optimizer_name_ssl: lars
          lr: 0.001
    transforms:
      - class_name: RecenterJoints
        from_module: skeleton_transforms
        in_test: true
        kwargs:
          anchor_joint_index: 2
      - class_name: NormalizeDistances
        from_module: skeleton_transforms
        in_test: true
        kwargs:
          anchor_joint_1_index: 1
          anchor_joint_2_index: 2
      - class_name: SkeletonSampler
        from_module: skeleton_transforms
        transform_name: sampling
        in_test: true
        kwargs:
          size: 50
      - class_name: ToTensor
        from_module: general_transforms
        in_test: true
      - class_name: Permute
        from_module: general_transforms
        in_test: true
        kwargs:
          shape: [1, 2, 0]
      - class_name: ToFloat
        from_module: general_transforms
        in_test: true 
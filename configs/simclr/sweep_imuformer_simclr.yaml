program: ssl_training.py
name: imuformer_simclr_sweep_utd
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --model=imuformer
  - --framework=simclr
  - --experiment_config_path
  - configs/simclr/imuformer_simclr_utd.yaml
  - --dataset_config_path
  - configs/dataset_configs.yaml
  - --dataset
  - utd_mhad
  - --data_path
  - processed_data/utd_mhad/multimodal_har_datasets
  - --augmentations_path
  - configs/inertial_augmentations/augmentations_utd.yaml
  - --no_ckpt
  - --sweep
method: bayes
metric:
  name: val_loss
  goal: minimize
early_terminate:
  type: hyperband
  min_iter: 30
  eta: 3
  s: 2
  max_iter: 150
parameters:
  # Only sweeping SSL parameters - encoder architecture is fixed as in imuformer_simclr_utd.yaml
  modalities.inertial.model.ssl.kwargs.batch_size:
    values: [16, 32, 64]
  modalities.inertial.model.ssl.kwargs.hidden:
    values: [[128, 64], [256, 128], [512, 256]]
  modalities.inertial.model.ssl.kwargs.temperature:
    distribution: uniform
    min: 0.05
    max: 0.3
  modalities.inertial.model.ssl.kwargs.n_views:
    values: [2, 4, 8]
  modalities.inertial.model.ssl.kwargs.lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-2 
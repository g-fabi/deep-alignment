program: ssl_training_mm.py
name: cmc_da_uncertainty_sweep_utd
command:
  - python
  - ssl_training_mm.py
  - --experiment_config_path
  - configs/cmc_da/cmc_da_imuformer_poseformer_utd.yaml
  - --dataset_config_path
  - configs/dataset_configs.yaml
  - --dataset
  - utd_mhad
  - --data_path
  - processed_data/utd_mhad/multimodal_har_datasets
  - --augmentations_path
  - configs/inertial_augmentations/augmentations_utd.yaml
  - configs/skeleton_augmentations/augmentations_utd.yaml
  - --modalities
  - inertial
  - skeleton
  - --models
  - imuformer
  - poseformerv4
  - --num-workers
  - 32
  - --framework
  - cmc-da
  - --sweep
  - --max_epochs=150
method: bayes
metric:
  name: ssl_val_loss
  goal: minimize

early_terminate:
  type: hyperband
  min_iter: 25
  eta: 3
  s: 2
  max_iter: 150
  
parameters:
  # Uncertainty Weighting Parameters
  ssl.weighting.uncertainty:
    value: true
  ssl.weighting.constant:
    value: false
  ssl.weighting.uncertainty_params.init_log_sigma_ntxent:
    value: 0.0
  ssl.weighting.uncertainty_params.init_log_sigma_da:
    value: 0.0

  # Deep Alignment Parameters
  ssl.da_kwargs.beta:
    distribution: uniform
    min: 0.1
    max: 0.9
  ssl.da_kwargs.iteration:
    distribution: int_uniform
    min: 10
    max: 100
  ssl.da_kwargs.common_dim:
    values: [256, 512, 1024]
  ssl.da_kwargs.weight_spatial:
    distribution: uniform
    min: 0.5
    max: 1.5
  ssl.da_kwargs.weight_temporal:
    distribution: uniform
    min: 0.5
    max: 1.5

  seed:
    values: [28] 
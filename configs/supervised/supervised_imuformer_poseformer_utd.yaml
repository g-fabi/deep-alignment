experiment:
  seed: 28
  num_epochs: 92
  batch_size: 64

modalities:
  inertial:
    model:
      imuformer:
        class_name: IMUFormer
        from_module: IMUFormer
        encoder_class_name: IMUFormer
        encoder_name: imuformer
        args: []
        kwargs:
          d_model: 256
          num_layers: 3
          heads: 4
          _heads: 6
          sample_length: 60
          dropout: 0.08553562864390574
          pe_k: 40
          cnn_units: 6
          cnn_kernel_sizes: [[1,1], [7,7], [9,9]]
          batch_size: 32
          lr: 0.00020786739595865915
          optimizer_name: "adam"
          metric_name: "accuracy"
    transforms:
      - class_name: InertialSampler
        from_module: inertial_transforms
        transform_name: sampling
        in_test: true
        kwargs:
          size: 60
      - class_name: ToTensor
        from_module: general_transforms
        transform_name: to_tensor
        in_test: true
      - class_name: Permute
        from_module: general_transforms
        transform_name: permutation
        in_test: true
        kwargs:
          shape: [1, 0]
      - class_name: ToFloat
        from_module: general_transforms
        transform_name: to_float
        in_test: true

  skeleton:
    model:
      poseformer:
        class_name: PoseFormer
        from_module: PoseFormerV4
        encoder_class_name: PoseFormer
        encoder_name: poseformer
        args: []
        kwargs:
          sample_length: 60
          opt:
            layers: 6
            number_of_kept_frames: 60
            number_of_kept_coeffs: 60
            naive: false
          embed_dim_ratio: 64
          num_heads: 8
          mlp_ratio: 4
          qkv_bias: true
          drop_rate: 0.2482604230164648
          attn_drop_rate: 0.0199469937072425
          drop_path_rate: 0.01977258832804884
          batch_size: 32
          lr: 0.004782886893334658
          optimizer_name: "adam"
          metric_name: "accuracy"
    transforms:
      - class_name: RecenterJoints
        from_module: skeleton_transforms
        in_test: true
        kwargs:
          anchor_joint_index: 2
      - class_name: NormalizeDistances
        from_module: skeleton_transforms
        in_test: true
        kwargs:
          anchor_joint_1_index: 1
          anchor_joint_2_index: 2
      - class_name: SkeletonSampler
        from_module: skeleton_transforms
        transform_name: sampling
        in_test: true
        kwargs:
          size: 60
      - class_name: ToTensor
        from_module: general_transforms
        in_test: true
      - class_name: Permute
        from_module: general_transforms
        in_test: true
        kwargs:
          shape: [1, 2, 0]
      - class_name: ToFloat
        from_module: general_transforms
        in_test: true